[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flexnoc"
version = "0.1.0"
description = "A configurable, modular, packet-switched Network-on-Chip implemented in synthesizable SystemVerilog."
readme = "README.md"
authors = [{ name = "FlexNoC Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
